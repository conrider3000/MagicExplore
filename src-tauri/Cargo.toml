[package]
name = "magic-explore"
version = "1.0.0"
description = "Magic Explore — Barra de busca flutuante estilo Apple Spotlight para Windows 10 e 11"
authors = ["Magic Explore"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
window-vibrancy = "0.5"
winreg = "0.52"
png = "0.17"
base64 = "0.22"
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_Accessibility",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
] }

# Mantém tabelas de símbolos e unwind padrão do MSVC para evitar falsos-positivos de heurística (Wacatac) no Windows Defender
[profile.release]
opt-level = 2
strip = false
lto = false
