<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Magic Explore Backdrop</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 48%, #161826 0%, #0b0c12 65%, #07080c 100%);
      cursor: default;
    }

    .ambient-glow {
      position: absolute;
      width: 540px;
      height: 320px;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(10, 132, 255, 0.14) 0%, rgba(124, 77, 255, 0.06) 45%, transparent 72%);
      pointer-events: none;
      filter: blur(24px);
    }
  </style>
</head>
<body>
  <div class="ambient-glow"></div>
  <script>
    window.addEventListener("mousedown", () => {
      if (window.__TAURI__ && window.__TAURI__.core) {
        window.__TAURI__.core.invoke("hide_main_window").catch(() => {});
      }
    });
    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && window.__TAURI__ && window.__TAURI__.core) {
        window.__TAURI__.core.invoke("hide_main_window").catch(() => {});
      }
    });
  </script>
</body>
</html>
