<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Magic Explore — Aviso</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
    }

    .pill {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 8px 16px;
      border-radius: 999px;
      background: rgba(24, 24, 28, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.48), inset 0 1px 0 rgba(255, 255, 255, 0.14);
      color: #f5f5f7;
      font-size: 12.5px;
      font-weight: 500;
      letter-spacing: -0.01em;
      white-space: nowrap;
      opacity: 0;
      transform: translateY(-8px) scale(0.96);
      transition: opacity 0.22s cubic-bezier(0.22, 1, 0.36, 1), transform 0.22s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .pill.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .toast-logo {
      width: 18px;
      height: 18px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #ff9f0a;
      box-shadow: 0 0 8px rgba(255, 159, 10, 0.75);
      flex-shrink: 0;
    }

    .title {
      color: #ffffff;
      font-weight: 600;
    }

    .sep {
      color: rgba(255, 255, 255, 0.32);
    }

    .sub {
      color: rgba(245, 245, 247, 0.76);
      font-weight: 400;
    }
  </style>
</head>
<body>
  <div id="pill" class="pill">
    <img src="logo.png" alt="" class="toast-logo" />
    <span class="dot"></span>
    <span class="title">Tela de Administrador</span>
    <span class="sep">·</span>
    <span class="sub" id="toast-msg">Magic Explore pausado nesta janela</span>
  </div>

  <script>
    const pill = document.getElementById("pill");
    const msgEl = document.getElementById("toast-msg");
    let hideAnimTimer = null;

    function triggerShow(msg) {
      if (msg) msgEl.textContent = msg;
      clearTimeout(hideAnimTimer);
      pill.classList.remove("visible");
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          pill.classList.add("visible");
        });
      });
      hideAnimTimer = setTimeout(() => {
        pill.classList.remove("visible");
      }, 2800);
    }

    if (window.__TAURI__ && window.__TAURI__.event) {
      window.__TAURI__.event.listen("admin-toast-show", (event) => {
        triggerShow(event.payload && event.payload.message);
      });
      window.__TAURI__.event.listen("admin-toast-hide", () => {
        clearTimeout(hideAnimTimer);
        pill.classList.remove("visible");
      });
    }
  </script>
</body>
</html>
